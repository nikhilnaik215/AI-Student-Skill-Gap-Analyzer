# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
# Note: createDatabaseIfNotExist=true ensures the database is created automatically upon startup
spring.datasource.url=jdbc:mysql://localhost:3306/skill_gap_analyzer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-milliseconds=86400000

# AI Configuration (Optional Gemini API Key - rule-based expert engine runs automatically if not provided)
app.gemini.api-key=${GEMINI_API_KEY:}

# OpenAPI / Swagger Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
